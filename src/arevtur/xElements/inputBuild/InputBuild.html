<style>
	@import '../sharedStyle.css';

	.container {
		display: inline-block;
		padding: 5px;
	}

	label:not(:first-child) {
		margin-left: 15px;
	}

	x-numeric-input::part(input) {
		width: 60px;
	}

	:is(#effective-health-weight, #total-life-weight, #total-mana-weight, #mana-regen-weight)::part(input) {
		background-color: var(--colored-text-background-blue)
	}

	:is(#elemental-resist-weight, #chaos-resist-weight)::part(input) {
		background-color: var(--colored-text-background-orange)
	}

	#damage-weight::part(input) {
		background-color: var(--colored-text-background-red)
	}

	.attribute-weight::part(input) {
		background-color: var(--colored-text-background-light-green)
	}

	.collapse-toggle {
		margin-top: 4px;
	}

	.collapsible {
		display: grid;
		grid-template-rows: 0fr;
		transition: grid-template-rows 200ms ease;
	}

	.collapsible.expanded {
		grid-template-rows: 1fr;
	}

	.collapsible-inner {
		overflow: hidden;
		min-height: 0;
	}

	.chevron {
		display: inline-block;
		transition: transform 200ms ease;
	}

	.expanded-toggle .chevron {
		transform: rotate(90deg);
	}

	.no-transition, .no-transition .chevron {
		transition: none;
	}

	@media (prefers-reduced-motion: reduce) {
		.collapsible, .chevron {
			transition: none;
		}
	}
</style>

<span class="container pob">
	<x-path-select id="pob-path" directory
				   placeholder="Select PoB Path"></x-path-select>
	<x-path-select id="build-path" extension="xml"
				   placeholder="Select PoB Build"></x-path-select>
	<button id="reload" title="Click this if you've tweaked your build in PoB">Reload Build</button>
	<button id="reset" title="Reset weights to default values. Can't be undone.">Reset</button>
	<div class="tour-pob-configs">
		<button id="weights-toggle" class="collapse-toggle" aria-expanded="false" aria-controls="weights-body">
			<span class="chevron">▸</span> Scoring weights
		</button>
		<div id="weights-body" class="collapsible" inert>
		<div class="collapsible-inner">
		<x-arrangeable-list id="weights"></x-arrangeable-list>
		<div class="version-1">
			<label title="">
				Include Eldritch Mods
				<input id="include-eldritch-check" type="checkbox">
			</label>
			<label title="">
				Include Influence Mods
				<input id="include-influence-check" type="checkbox">
			</label>
			<label title="">
				Include Talisman Mods
				<input id="include-talisman-check" type="checkbox">
			</label>
		</div>
		<div>
			<label title="Exclude ES from Effective Hit Pool">
				Ignore ES
				<input id="ignore-es-check" type="checkbox">
			</label>
			<label title="Exclude uncapped elemental resits from Effective Hit pool calculations. Elemental resist weights will still apply.">
				Equal elemental resists
				<input id="equal-elemental-resists-check" type="checkbox">
			</label>
			<label title="Exclude uncapped chaos resits from Effective Hit pool calculations. Chaos resist weight will still apply.">
				Equal chaos resists
				<input id="equal-chaos-resist-check" type="checkbox">
			</label>
			<label title="PoB 2 does not calculate leech correctly otherwise.">
				Infinite leech
				<input id="infinite-leech-check" type="checkbox">
			</label>
		</div>
		</div>
		</div>
	</div>
</span>
